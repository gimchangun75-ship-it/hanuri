      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }
    .brand p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mode-group {
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #334155;
      display: flex;
      gap: 4px;
      margin-right: 4px;
    }
    .btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: #475569;
      border-color: #60a5fa;
    }
    .btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
    .btn-emerald {
      background: #059669;
      border-color: #10b981;
      color: #ffffff;
    }
    .btn-emerald:hover {
      background: #047857;
    }
    .zoom-badge {
      font-family: monospace;
      font-size: 14px;
      font-weight: 800;
      color: #fde047;
      min-width: 58px;
      text-align: center;
    }
    #canvasWrap {
      flex: 1;
      position: relative;
      cursor: grab;
      user-select: none;
      touch-action: none;
      background-color: #0f172a;
      background-image: radial-gradient(rgba(148, 163, 184, 0.2) 1.5px, transparent 1.5px);
      background-size: 26px 26px;
      overflow: hidden;
    }
    #canvasWrap:active {
      cursor: grabbing;
    }
    .node-group {
      cursor: pointer;
      transition: filter 0.18s ease, opacity 0.2s ease;
    }
    .node-group:hover {
      filter: drop-shadow(0 10px 20px rgba(59, 130, 246, 0.4));
    }
    .svg-open-btn {
      cursor: pointer;
    }
    .svg-open-btn:hover rect {
      fill: #f59e0b !important;
    }
    .svg-open-btn:hover text {
      fill: #0f172a !important;
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -24; }
    }
    .edge-animated {
      stroke-dasharray: 8 4;
      animation: dashFlow 0.9s linear infinite;
    }
    footer {
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .footer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .detail-box {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 800;
      background: #2563eb;
      color: #fff;
      white-space: nowrap;
    }
    .detail-text {
      font-size: 14.5px;
      color: #e2e8f0;
      line-height: 1.4;
    }
    .links-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .file-link-btn {

      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 13.5px;

            borderColor: "#34d399",
            textColor: "#064e3b",
            desc: "수업지원시스템 평가자료와 연계하여 구성된 복습 확인 학습지 및 어휘 테스트지 세트입니다.",
            links: [
              { label: "📝 1차시 어휘 충전.hwp 열기", url: "파일검색.html?q=1 헷갈리는 말 1차시 어휘 충전&preview=1", fileUrl: "다다어휘/1 헷갈리는 말 1차시 어휘 충전.hwp" },
              { label: "📝 1차시 문어잼.hwp 열기", url: "파일검색.html?q=1 헷갈리는 말 1차시.hwp&preview=1", fileUrl: "다다어휘/1 헷갈리는 말 1차시.hwp" }
            ]
          }
        ],
        edges: [
          { from: "p_edunet_main", to: "p_edunet_member", label: "회원/반 관리" },
          { from: "p_edunet_main", to: "p_edunet_order", label: "교재 주문/진단" },
          { from: "p_edunet_main", to: "p_teaching_hub", label: "selectToken SSO" },
          { from: "p_teaching_hub", to: "p_ts_source", label: "11월호 계획안" },
          { from: "p_teaching_hub", to: "p_ts_test", label: "11월호 필독서퀴즈" },
          { from: "p_teaching_hub", to: "p_ts_errata", label: "정오표/학부모/상담" },
          { from: "p_ts_source", to: "p_local_dada", label: "로컬 교재 활용 매핑" },
          { from: "p_ts_test", to: "p_local_quiz", label: "복습/평가 세트 연결" }
        ]
      }
    };

    let currentMode = "arch";
    let selectedNodeId = null;
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const svgEl = document.getElementById("ontologySvg");
    const viewportGroup = document.getElementById("viewportGroup");
    const edgesLayer = document.getElementById("edgesLayer");
    const nodesLayer = document.getElementById("nodesLayer");
    const zoomLabel = document.getElementById("zoomLabel");
    const detailBadge = document.getElementById("detailBadge");
    const detailText = document.getElementById("detailText");
    const btnShowAll = document.getElementById("btnShowAll");
    const linksContainer = document.getElementById("linksContainer");

    function renderLinks(links) {
      const list = links && links.length ? links : DEFAULT_LINKS;
      linksContainer.innerHTML = list.map(item => {
        let html = `<a href="${item.url}" target="_blank" class="file-link-btn">${item.label} ↗</a>`;
        if (item.fileUrl) {
          const shortName = item.fileUrl.split("/").pop();
          html += `<a href="${item.fileUrl}" download="${shortName}" class="file-link-btn direct-dl" title="한글(.hwp/.hwpx) 원본 파일을 바로 내려받아 실행합니다">📥 ${shortName} 파일받기</a>`;
        }
        return html;
      }).join("");
    }

    function updateTransform() {
      viewportGroup.setAttribute("transform", `translate(${panX}, ${panY}) scale(${scale})`);
      zoomLabel.textContent = Math.round(scale * 100) + "%";
    }

    function zoomBy(factor, centerX = 575, centerY = 250) {
      const newScale = Math.min(3.5, Math.max(0.4, scale * factor));
      panX = centerX - (centerX - panX) * (newScale / scale);
      panY = centerY - (centerY - panY) * (newScale / scale);
      scale = newScale;
      updateTransform();
    }

    function resetView() {
      scale = 1;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    function switchMode(mode) {
      currentMode = mode;
      selectedNodeId = null;
      resetView();
      document.getElementById("btnModeArch").classList.toggle("active", mode === "arch");
      document.getElementById("btnModeReal").classList.toggle("active", mode === "real");
      document.getElementById("btnModePortal").classList.toggle("active", mode === "portal");
      btnShowAll.style.display = "none";
      
      if (mode === "arch") {
        detailBadge.textContent = "전체 온톨로지";
        detailBadge.style.backgroundColor = "#2563eb";
        detailText.innerHTML = "다이어그램의 <strong>각 박스(노드)</strong>나 <strong>아래 링크 버튼</strong>을 클릭하면 <strong>새 브라우저 창</strong>으로 문서 내용과 파일이 즉시 열립니다.";
      } else if (mode === "real") {
        detailBadge.textContent = "실제 자료 연결망";
        detailBadge.style.backgroundColor = "#7c3aed";
        detailText.innerHTML = "<strong>다다어휘 1호</strong>를 중심으로 수업반, 본교재, 복습지, 개별 어휘 개념의 직통 링크를 제공합니다.";
      } else {
        detailBadge.textContent = "포털 연계 온톨로지";
        detailBadge.style.backgroundColor = "#d97706";
        detailText.innerHTML = "<strong>한우리 에듀넷 본원</strong>과 <strong>수업지원시스템</strong>, 그리고 <strong>로컬 교재</strong> 간의 유기적 데이터 연결망을 탐색하고 원클릭으로 바로 이동합니다.";
      }
      renderLinks(DEFAULT_LINKS);
      renderDiagram();
    }

    function clearSelection() {
      selectedNodeId = null;
      btnShowAll.style.display = "none";
      if (currentMode === "arch") {
        detailBadge.textContent = "전체 온톨로지";
        detailBadge.style.backgroundColor = "#2563eb";
      } else if (currentMode === "real") {
        detailBadge.textContent = "실제 자료 연결망";
        detailBadge.style.backgroundColor = "#7c3aed";
      } else {
        detailBadge.textContent = "포털 연계 온톨로지";
        detailBadge.style.backgroundColor = "#d97706";
      }
      detailText.innerHTML = "박스를 클릭하면 해당 노드와 연결된 실제 웹 링크 및 파일 바로가기가 표시됩니다.";
      renderLinks(DEFAULT_LINKS);
      renderDiagram();
    }

    function selectNode(node) {
      selectedNodeId = node.id;
      detailBadge.textContent = `${node.icon} ${node.title}`;
      detailBadge.style.backgroundColor = node.headerBg;
      detailText.textContent = node.desc;
      btnShowAll.style.display = "inline-flex";
      renderLinks(node.links);
      renderDiagram();
    }

    function renderDiagram() {
      const data = DATASETS[currentMode];
      const nodeMap = {};
      data.nodes.forEach(n => nodeMap[n.id] = n);

      const connectedIds = new Set();
      if (selectedNodeId) {
        connectedIds.add(selectedNodeId);
        data.edges.forEach(e => {
          if (e.from === selectedNodeId) connectedIds.add(e.to);
          if (e.to === selectedNodeId) connectedIds.add(e.from);
        });
      }

      edgesLayer.innerHTML = data.edges.map(e => {
        const n1 = nodeMap[e.from];
        const n2 = nodeMap[e.to];
        const x1 = n1.x + n1.w;
        const y1 = n1.y + n1.h / 2;
        const x2 = n2.x;
        const y2 = n2.y + n2.h / 2;
        const dx = Math.abs(x2 - x1) * 0.5;
        const pathD = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2 - 4} ${y2}`;

        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;

        const isHighlighted = selectedNodeId && (e.from === selectedNodeId || e.to === selectedNodeId);
        const isDimmed = selectedNodeId && !isHighlighted;

        const strokeColor = isHighlighted ? "#fbbf24" : "#60a5fa";
        const strokeWidth = isHighlighted ? "4" : "2.8";
        const opacity = isDimmed ? "0.2" : "1";
        const marker = isHighlighted ? "url(#arrow-active)" : "url(#arrow-blue)";
        const animClass = isHighlighted ? "edge-animated" : "";
        const labelWidth = e.label.length * 11.5 + 24;

        return `
          <g style="opacity: ${opacity}">
            <path d="${pathD}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" class="${animClass}" marker-end="${marker}" />
            <rect x="${midX - labelWidth / 2}" y="${midY - 14}" width="${labelWidth}" height="26" rx="13" fill="#0f172a" stroke="${strokeColor}" stroke-width="1.6" />
            <text x="${midX}" y="${midY + 4}" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">${e.label}</text>
          </g>
        `;
      }).join("");

      nodesLayer.innerHTML = data.nodes.map(n => {
        const isSelected = selectedNodeId === n.id;
        const isDimmed = selectedNodeId && !connectedIds.has(n.id);
        const opacity = isDimmed ? "0.28" : "1";
        const strokeW = isSelected ? "4.5" : "2.5";
        const strokeC = isSelected ? "#fbbf24" : n.borderColor;

        return `
          <g class="node-group" data-id="${n.id}" style="opacity: ${opacity}" filter="url(#card-shadow)">
            <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="15" fill="${n.cardBg}" stroke="${strokeC}" stroke-width="${strokeW}" />
            <path d="M ${n.x} ${n.y + 15} Q ${n.x} ${n.y} ${n.x + 15} ${n.y} L ${n.x + n.w - 15} ${n.y} Q ${n.x + n.w} ${n.y} ${n.x + n.w} ${n.y + 15} L ${n.x + n.w} ${n.y + 42} L ${n.x} ${n.y + 42} Z" fill="${n.headerBg}" />
            <text x="${n.x + 14}" y="${n.y + 28}" fill="#ffffff" font-size="15.5" font-weight="800">${n.icon} ${n.title}</text>
            <g class="svg-open-btn" data-open-id="${n.id}">
              <rect x="${n.x + n.w - 56}" y="${n.y + 9}" width="46" height="24" rx="7" fill="rgba(255,255,255,0.22)" />
              <text x="${n.x + n.w - 33}" y="${n.y + 25}" text-anchor="middle" fill="#fde047" font-size="12" font-weight="800">🔗열기</text>
            </g>
            <text x="${n.x + 15}" y="${n.y + 70}" fill="${n.textColor}" font-size="14" font-weight="700">• ${n.sub1}</text>
            <text x="${n.x + 15}" y="${n.y + 95}" fill="${n.textColor}" font-size="13" font-weight="600" opacity="0.9">• ${n.sub2}</text>
          </g>
        `;
      }).join("");

      nodesLayer.querySelectorAll(".svg-open-btn").forEach(btn => {
        btn.addEventListener("click", (ev) => {
          ev.stopPropagation();
          const id = btn.getAttribute("data-open-id");
          const node = nodeMap[id];
          if (node && node.links && node.links[0]) {
            window.open(node.links[0].url, "_blank");
          }
        });
      });

      nodesLayer.querySelectorAll(".node-group").forEach(g => {
        g.addEventListener("click", (ev) => {
          if (ev.target.closest(".svg-open-btn")) return;
          ev.stopPropagation();
          const id = g.getAttribute("data-id");
          const node = nodeMap[id];
          if (node) selectNode(node);
        });
      });
    }

    const canvasWrap = document.getElementById("canvasWrap");
    canvasWrap.addEventListener("wheel", (e) => {
      e.preventDefault();
      const rect = svgEl.getBoundingClientRect();
      const svgX = ((e.clientX - rect.left) / rect.width) * 1150;
      const svgY = ((e.clientY - rect.top) / rect.height) * 500;
      const factor = e.deltaY < 0 ? 1.15 : 0.87;
      zoomBy(factor, svgX, svgY);
    }, { passive: false });

    canvasWrap.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".node-group") || e.target.closest(".svg-open-btn")) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      canvasWrap.setPointerCapture(e.pointerId);
    });

    canvasWrap.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const rect = svgEl.getBoundingClientRect();
      const dx = ((e.clientX - startX) / rect.width) * 1150;
      const dy = ((e.clientY - startY) / rect.height) * 500;
      panX += dx;
      panY += dy;
      startX = e.clientX;
      startY = e.clientY;
      updateTransform();
    });

    canvasWrap.addEventListener("pointerup", () => {
      isDragging = false;
    });

    renderLinks(DEFAULT_LINKS);
    renderDiagram();
  </script>
