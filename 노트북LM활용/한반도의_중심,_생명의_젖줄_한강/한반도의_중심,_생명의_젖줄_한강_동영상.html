<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>《한반도의 중심, 생명의 젖줄 한강》 영상 스토리보드 및 대본</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B00;
      --primary-dark: #D95300;
      --primary-light: #FFF4ED;
      --navy: #0F172A;
      --navy-light: #1E293B;
      --slate-50: #F8FAFC;
      --slate-100: #F1F5F9;
      --slate-200: #E2E8F0;
      --slate-300: #CBD5E1;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1E293B;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --card-bg: #FFFFFF;
      --border-color: #E2E8F0;
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 6px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 16px rgba(15,23,42,0.08);
      --shadow-lg: 0 12px 30px rgba(15,23,42,0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      line-height: 1.6;
      padding: 30px 20px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      background: #1E293B;
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .top-toolbar {
      background: #0B0F19;
      color: #fff;
      padding: 12px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .brand-badge span {
      background: #10B981;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .video-header {
      padding: 45px 40px 30px;
      background: linear-gradient(180deg, rgba(16, 185, 129, 0.1) 0%, rgba(30, 41, 59, 0) 100%);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .header-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: #34D399;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .video-title {
      font-family: 'Noto Serif KR', serif;
      font-size: 28px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .synopsis-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-top: 15px;
      font-size: 14px;
      color: #CBD5E1;
      line-height: 1.6;
    }

    .synopsis-box strong {
      color: #34D399;
    }

    .content-body {
      padding: 35px 40px;
    }

    .scenes-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .scene-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      padding: 24px;
      position: relative;
      transition: all 0.2s;
    }

    .scene-card:hover {
      border-color: rgba(52, 211, 153, 0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .scene-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .scene-num-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scene-num {
      background: #10B981;
      color: #0F172A;
      font-weight: 900;
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .scene-title {
      font-size: 18px;
      font-weight: 700;
      color: #F8FAFC;
    }

    .scene-duration {
      font-size: 12.5px;
      color: #94A3B8;
      background: rgba(255,255,255,0.06);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .scene-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .scene-box {
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 13.5px;
    }

    .visual-box {
      background: rgba(255,255,255,0.03);
      border-left: 3px solid #38BDF8;
    }

    .visual-box .box-lbl {
      font-size: 11.5px;
      font-weight: 700;
      color: #38BDF8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .visual-box .box-txt {
      color: #E2E8F0;
      line-height: 1.55;
    }

    .narration-box {
      background: rgba(16, 185, 129, 0.08);
      border-left: 3px solid #10B981;
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left-width: 4px;
    }

    .narration-box .box-lbl {
      font-size: 11.5px;
      font-weight: 700;
      color: #34D399;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .narration-box .box-txt {
      color: #FFFFFF;
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.65;
    }

    .bgm-tag {
      font-size: 12px;
      color: #F59E0B;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }

    .doc-footer {
      padding: 24px 40px;
      background: #0B0F19;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748B;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #10B981;
      color: #0F172A;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media print {
      body { background: #FFFFFF !important; color: #000 !important; padding: 0 !important; }
      .container { background: #FFFFFF !important; color: #000 !important; border: none !important; box-shadow: none !important; }
      .top-toolbar, .toast, .btn { display: none !important; }
      .video-header { background: none !important; border-bottom: 2px solid #000 !important; padding: 15px 0 !important; }
      .video-title { color: #000 !important; font-size: 22px !important; }
      .synopsis-box { background: #f8f8f8 !important; color: #333 !important; border: 1px solid #ccc !important; }
      .content-body { padding: 15px 0 !important; }
      .scene-card { page-break-inside: avoid; background: #fff !important; border: 1px solid #999 !important; margin-bottom: 20px !important; }
      .scene-title { color: #000 !important; }
      .visual-box { background: #f9f9f9 !important; color: #333 !important; border-left-color: #555 !important; }
      .visual-box .box-txt { color: #333 !important; }
      .narration-box { background: #f4f4f4 !important; color: #000 !important; border: 1px solid #ccc !important; border-left-color: #000 !important; }
      .narration-box .box-txt { color: #000 !important; font-weight: bold !important; }
      .doc-footer { border-top: 1px solid #ccc !important; padding: 15px 0 !important; color: #666 !important; background: none !important; }
    }

    /* ── 동영상 다크 테마 (기본값 고정) ── */
    body[data-theme="dark"] {
      background: #0F172A;
      color: #F8FAFC;
    }
    body[data-theme="dark"] .container { background: #1E293B; border-color: rgba(255,255,255,0.1); }
    body[data-theme="dark"] .top-toolbar { background: #0B0F19; }
    body[data-theme="dark"] .scene-card { background: rgba(15,23,42,0.7); border-color: rgba(255,255,255,0.1); }
    body[data-theme="dark"] .visual-box { background: rgba(15,23,42,0.6); color: #CBD5E1; border-left-color: #38BDF8; }
    body[data-theme="dark"] .narration-box { background: rgba(255,107,0,0.1); border-left-color: #FF6B00; color: #F8FAFC; }
    body[data-theme="dark"] .synopsis-box { background: rgba(15,23,42,0.6); color: #CBD5E1; }

    /* ── 동영상 웜 테마 ── */
    body[data-theme="warm"] {
      background: #F5EBE0;
      color: #3D2B1F;
    }
    body[data-theme="warm"] .container { background: #FAF6F0; border-color: #E5D4C4; }
    body[data-theme="warm"] .top-toolbar { background: #3D2B1F; }
    body[data-theme="warm"] .video-header { background: linear-gradient(180deg, rgba(255,107,0,0.08) 0%, rgba(250,246,240,0) 100%); border-bottom-color: #E5D4C4; }
    body[data-theme="warm"] .video-title { color: #3D2B1F; }
    body[data-theme="warm"] .scene-card { background: #FAF6F0; border-color: #E5D4C4; }
    body[data-theme="warm"] .scene-head { border-bottom-color: #E5D4C4; }
    body[data-theme="warm"] .visual-box { background: #EDE0D4; color: #5A3E32; border-left-color: #D95300; }
    body[data-theme="warm"] .narration-box { background: rgba(255,107,0,0.08); color: #3D2B1F; border-left-color: #FF6B00; border-color: #E5D4C4; }
    body[data-theme="warm"] .synopsis-box { background: rgba(61,43,31,0.08); color: #5A3E32; border-color: #E5D4C4; }
    body[data-theme="warm"] .synopsis-box strong { color: #D95300; }
    body[data-theme="warm"] .header-badge { background: rgba(255,107,0,0.15); color: #D95300; border-color: rgba(255,107,0,0.3); }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-toolbar">
      <div class="brand-badge">
        <span>CINEMATIC</span> 한우리 교육 영상 스토리보드 센터
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="copyAllNarrations()">📋 나레이션 전체 복사</button>
        <button class="btn" onclick="window.print()">🖨️ 인쇄 / PDF 저장</button>
      </div>
    </div>

    <header class="video-header">
      <div class="header-badge">VIDEO OVERVIEW & STORYBOARD</div>
      <h1 class="video-title" id="videoTitle">한반도의 중심, 생명의 젖줄 한강</h1>
      <div class="synopsis-box" id="synopsisBox">
        <strong>[기획 의도]</strong> <span id="synopsisText">로딩 중...</span>
      </div>
    </header>

    <main class="content-body">
      <div class="scenes-list" id="scenesContainer"></div>
    </main>

    <footer class="doc-footer">
      <div>© 2026 한우리독서토론논술 · 지식 팩토리 자동화 시스템</div>
      <div>영상 규격: 짧은 버전 (9:16 / 16:9 숏폼 & 유튜브 겸용)</div>
    </footer>
  </div>

  <div class="toast" id="toast">나레이션 대본이 복사되었습니다! ✨</div>

  <script>
    const VIDEO_DATA = {
  "title": "한강의 비밀: 개발의 상처에서 생명의 부활로",
  "target_duration": "3분 30초",
  "synopsis": "한반도의 중심을 흐르는 한강의 발원과 역사적 변천부터 산업화 과정에서 입은 생태적 상처와 밤섬·수달의 기적 같은 자연 회복의 이야기를 조명합니다. 개발과 보존이라는 갈등 속에서 미래 세대가 한강과 어떻게 공존해야 할지 깊이 있는 질문을 던집니다.",
  "scenes": [
    {
      "scene_no": 1,
      "title": "두물머리와 검룡소, 생명의 발원",
      "duration": "30초",
      "visual": "태백산 깊은 숲속 검룡소에서 맑은 샘물이 솟아나는 장면과 금강산에서 시작된 북한강의 장엄한 물길. 이어 경기도 양평 양수리 두물머리에서 두 물줄기가 합쳐져 웅장한 한강을 이루는 항공 촬영 영상.",
      "narration": "태백산 검룡소의 아담한 샘물과 금강산의 강렬한 물줄기가 숲과 들판을 지나 양평 두물머리에서 하나로 만납니다. 이렇게 합쳐진 한강은 한반도의 허리를 가로지르며 수많은 생명을 보살피는 젖줄이 됩니다.",
      "bgm_mood": "신비롭고 맑은 어쿠스틱 국악 앙상블"
    },
    {
      "scene_no": 2,
      "title": "삼국시대 영토 쟁탈과 조선의 도읍",
      "duration": "35초",
      "visual": "암사동 움집 유적지와 고구려·백제·신라가 한강 유역을 두고 펼친 치열한 영토 지도 애니메이션. 이어 태조 이성계가 풍수지리상 명당으로 선정한 한양 도읍지와 한강변 나룻배, 어로, 빨래터의 일상 모습 묘사.",
      "narration": "한강은 선사 시대부터 삶의 터전이었으며, 삼국 시대에는 한반도의 주도권을 쥔 백제, 고구려, 신라가 치열하게 다툰 핵심 요충지였습니다. 조선을 세운 태조 이성계 역시 풍수지리를 고려해 한강이 흐르는 한양을 새 수도로 삼았습니다.",
      "bgm_mood": "서사적이고 웅장한 첼로와 오케스트라"
    },
    {
      "scene_no": 3,
      "title": "산업화와 한강의 기적, 콘크리트의 그늘",
      "duration": "35초",
      "visual": "전쟁의 폐허를 딛고 일어선 '한강의 기적'과 1980년대 한강종합개발 모습. 강변을 빼곡히 메운 콘크리트 제방과 직강화된 물길, 올림픽대로를 메운 차들, 그리고 용존산소량 0ppm으로 상실되어 가는 모래톱과 습지의 대비.",
      "narration": "급속한 경제 성장 속에서 한강은 '한강의 기적'이라는 화려한 이름 뒤에 깊은 생태적 상처를 입었습니다. 콘크리트 제방과 직강화 공사로 물고기들의 산란장이던 얕은 여울과 자연 필터인 모래톱이 사라졌습니다.",
      "bgm_mood": "긴장감 넘치고 다소 어두운 현대적 전자 오케스트라"
    },
    {
      "scene_no": 4,
      "title": "폭파되었던 밤섬의 부활",
      "duration": "35초",
      "visual": "1968년 여의도 윤중제를 쌓기 위해 다이너마이트 폭파로 사라지던 밤섬의 흑백 사료 화면. 이어서 자연적인 퇴적 작용으로 물밑에서 스스로 살아나 푸른 숲과 람사르 습지로 변모한 밤섬의 경이로운 현재 드론 영상.",
      "narration": "1968년 여의도를 개발하는 과정에서 윤중제를 쌓기 위해 밤섬은 폭파되어 지도에서 자취를 감추었습니다. 하지만 자연은 스스로의 퇴적 작용으로 밤섬을 다시 부활시켰고, 오늘날 수많은 철새가 찾아오는 람사르 습지가 되었습니다.",
      "bgm_mood": "감동적이고 신비로운 피아노 앤 첼로"
    },
    {
      "scene_no": 5,
      "title": "수달의 귀환과 자연성 회복",
      "duration": "35초",
      "visual": "콘크리트를 걷어내고 흙과 자갈을 깔아 조성한 자연형 호안의 모습. 1급수 맑은 물이 흐르는 중랑천과 여의도 샛강에서 헤엄치는 천연기념물 제330호 수달의 사랑스러운 수중 영상과 야생 동물들의 쉼터 연출.",
      "narration": "콘크리트 벽을 허물고 자연형 호안을 복원하자 멈추었던 한강 생태계의 시계가 다시 돌아가기 시작했습니다. 오염으로 자취를 감추었던 1급수 지표 동물이자 천연기념물 수달이 돌아오며 생명의 온기를 되찾고 있습니다.",
      "bgm_mood": "밝고 희망적인 어쿠스틱 피아노 멜로디"
    },
    {
      "scene_no": 6,
      "title": "미래를 향한 질문: 개발인가 공존인가",
      "duration": "40초",
      "visual": "신곡수중보를 둘러싼 자연성 회복파와 도시 기능 유지파의 대립 구도 그래픽. 노을빛으로 물든 한강 위를 떠다니는 유람선과 수변 공원에서 거니는 시민들, 맑은 한강 물길 위에 뜨는 질문 텍스트 모션 연출.",
      "narration": "신곡수중보 철거 논쟁이 보여주듯, 우리는 도시의 편의성과 자연의 원상 복원 사이에서 중요한 갈림길에 서 있습니다. 한강을 단순한 이용 대상이 아닌 생명의 파트너로 바라보는 시선, 이것이 바로 우리가 미래에 전할 대답입니다.",
      "bgm_mood": "깊은 울림을 주는 웅장하고 따뜻한 시네마틱 아웃트로"
    }
  ]
};

    document.addEventListener('DOMContentLoaded', () => {
      renderStoryboard(VIDEO_DATA);
    });

    function renderStoryboard(data) {
      if (data.title) {
        document.getElementById('videoTitle').innerText = data.title;
        document.title = data.title + " - 영상 스토리보드";
      }
      if (data.synopsis) {
        document.getElementById('synopsisText').innerText = `${data.synopsis} (총 예상 소요시간: ${data.target_duration || '약 3분'})`;
      }

      const container = document.getElementById('scenesContainer');
      container.innerHTML = '';

      (data.scenes || []).forEach(sc => {
        const div = document.createElement('div');
        div.className = 'scene-card';
        div.innerHTML = `
          <div class="scene-head">
            <div class="scene-num-title">
              <span class="scene-num">SCENE ${sc.scene_no}</span>
              <span class="scene-title">${sc.title}</span>
            </div>
            <span class="scene-duration">⏱️ ${sc.duration}</span>
          </div>
          <div class="scene-grid">
            <div class="scene-box visual-box">
              <div class="box-lbl">🎬 화면 연출 (Visual Prompt & Camera)</div>
              <div class="box-txt">${sc.visual}</div>
            </div>
            <div class="scene-box narration-box">
              <div class="box-lbl">
                <span>🎙️ 나레이션 대본 (Narration Script)</span>
                <button class="btn" style="padding:2px 8px; font-size:11px;" onclick="copyText('${escapeQuote(sc.narration)}')">복사</button>
              </div>
              <div class="box-txt">${sc.narration}</div>
              <div class="bgm-tag">🎵 BGM : ${sc.bgm_mood}</div>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function escapeQuote(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt).then(() => {
        showToast("씬 나레이션이 복사되었습니다!");
      });
    }

    function copyAllNarrations() {
      const allText = (VIDEO_DATA.scenes || []).map(s => `[SCENE ${s.scene_no} - ${s.title}]\n${s.narration}`).join('\n\n');
      navigator.clipboard.writeText(allText).then(() => {
        showToast("전체 나레이션 대본이 복사되었습니다!");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }

    // 대시보드 postMessage 테마 동기화
    
    try {
      const savedTheme = localStorage.getItem('hanuri_theme') || 'dark';
      document.body.dataset.theme = savedTheme;
    } catch(e) {}

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_THEME') {
        document.body.dataset.theme = e.data.theme;
      }
    });
    try {
      if (window.parent && window.parent.document && window.parent.document.body.dataset.theme) {
        document.body.dataset.theme = window.parent.document.body.dataset.theme;
      }
    } catch(e) {}
  </script>
</body>
</html>
