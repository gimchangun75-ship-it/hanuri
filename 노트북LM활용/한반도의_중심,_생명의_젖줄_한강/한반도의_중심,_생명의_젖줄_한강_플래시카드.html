<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한반도의 중심, 생명의 젖줄 한강 - 인터랙티브 플래시카드</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --sci-color: #38bdf8;
      --hist-color: #f59e0b;
      --pol-color: #ec4899;
      --peace-color: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 640px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #f59e0b, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.guide {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* 플래시카드 3D 컨테이너 */
    .flashcard-stage {
      width: 100%;
      max-width: 600px;
      height: 380px;
      perspective: 1200px;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--card-border);
      background: linear-gradient(145deg, #1e293b, #0f172a);
    }

    /* 앞면 */
    .card-front {
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .cat-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      letter-spacing: 0.5px;
    }
    .card-front .word-title {
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }
    .card-front .flip-hint {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }

    /* 뒷면 */
    .card-back {
      transform: rotateY(180deg);
      text-align: left;
      background: linear-gradient(145deg, #172554, #0f172a);
      border-color: #1e3a8a;
    }
    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }
    .back-desc {
      font-size: 17px;
      line-height: 1.65;
      color: #e2e8f0;
      font-weight: 500;
      word-break: keep-all;
      margin: auto 0;
    }
    .back-hint-box {
      background: rgba(15, 23, 42, 0.6);
      border-left: 3px solid var(--accent);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* 컨트롤 바 */
    .controls-wrap {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .nav-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .btn-nav {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      background: #1e293b;
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-nav:hover:not(:disabled) {
      background: #334155;
      border-color: var(--primary);
    }
    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-flip-trigger {
      background: var(--primary);
      color: #020617;
      border-color: var(--primary);
      flex: 1.2;
    }
    .btn-flip-trigger:hover {
      background: #0ea5e9;
    }

    /* ── 플래시카드 다크 테마 (기본값 고정) ── */
    body[data-theme="dark"] {
      background-color: #0B0F19;
      color: #F8FAFC;
    }
    body[data-theme="dark"] .card-face { background: linear-gradient(145deg, #1e293b, #0f172a); }
    body[data-theme="dark"] .card-back { background: linear-gradient(145deg, #172554, #0f172a); border-color: #1e3a8a; }
    body[data-theme="dark"] .card-front .word-title { color: #FFFFFF; }
    body[data-theme="dark"] .back-desc { color: #E2E8F0; }
    body[data-theme="dark"] .btn-nav { background: #1e293b; border-color: #334155; color: #F8FAFC; }
    body[data-theme="dark"] .btn-nav:hover:not(:disabled) { background: #334155; border-color: var(--primary); }

    /* ── 플래시카드 웜 테마 ── */
    body[data-theme="warm"] {
      background-color: #F5EBE0;
      color: #3D2B1F;
    }
    body[data-theme="warm"] .card-face { background: linear-gradient(145deg, #FAF6F0, #F5EBE0); border-color: #E5D4C4; }
    body[data-theme="warm"] .card-back { background: linear-gradient(145deg, #EDE0D4, #DFC9B2); border-color: #C9A88F; }
    body[data-theme="warm"] .card-front .word-title { color: #3D2B1F; }
    body[data-theme="warm"] .back-desc { color: #5A3E32; }
    body[data-theme="warm"] .back-hint-box { background: rgba(61,43,31,0.1); border-left-color: #D95300; color: #7A5C4A; }
    body[data-theme="warm"] .btn-nav { background: #FAF6F0; border-color: #E5D4C4; color: #3D2B1F; }
    body[data-theme="warm"] .btn-flip-trigger { background: var(--primary); color: #fff; border-color: var(--primary); }
    body[data-theme="warm"] h1 { background: linear-gradient(135deg, #D95300, #8B4513); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    body[data-theme="warm"] .badge { background: rgba(255,107,0,0.15); color: #D95300; border-color: rgba(255,107,0,0.3); }
    body[data-theme="warm"] .back-header { color: #D95300; }
    body[data-theme="warm"] .cat-badge { background: rgba(61,43,31,0.1); color: #7A5C4A; }
  </style>
</head>
<body>

  <header>
    <div class="badge">📇 한우리 3D 개념 플래시카드</div>
    <h1 id="fc-title">한반도의 중심, 생명의 젖줄 한강</h1>
    <p class="guide">카드를 클릭하거나 스페이스바를 누르면 앞/뒷면이 뒤집힙니다.</p>
  </header>

  <div class="flashcard-stage" onclick="flipCard()">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front">
        <span class="cat-badge" id="catBadge">분야</span>
        <div class="word-title" id="wordTitle">개념 단어</div>
        <div class="flip-hint">👆 클릭하여 뜻과 해설 확인</div>
      </div>
      <div class="card-face card-back">
        <div class="back-header">
          <span id="backCategory">분야 해설</span>
          <span>🔄 다시 클릭 시 앞면</span>
        </div>
        <div class="back-desc" id="backDesc">상세 설명이 들어갑니다.</div>
        <div class="back-hint-box" id="backHintBox">
          <strong>💡 핵심 힌트:</strong> <span id="backHint">힌트</span>
        </div>
      </div>
    </div>
  </div>

  <div class="controls-wrap">
    <div class="progress-info">
      <span id="cardCounter">카드 1 / 15</span>
      <span id="catStats">과학 · 역사 · 국제정치</span>
    </div>
    <div class="nav-buttons">
      <button class="btn-nav" id="btnPrev" onclick="prevCard()">◀ 이전</button>
      <button class="btn-nav btn-flip-trigger" onclick="flipCard()">🔄 뒤집기</button>
      <button class="btn-nav" id="btnNext" onclick="nextCard()">다음 ▶</button>
    </div>
  </div>

  <script>
    const FLASHCARDS = [
  {
    "id": 1,
    "category": "용어",
    "front": "북한강",
    "back": "금강산에서 시작되어 강원도 철원, 화천, 춘천과 경기도 가평, 양평을 거쳐 흐르는 한강의 상류 물줄기입니다. 경기도 양평 양수리에서 남한강과 합류하여 하나의 한강을 이룹니다.",
    "hint": "금강산에서 시작하여 양평 양수리로 흐르는 한강의 북쪽 물줄기입니다."
  },
  {
    "id": 2,

    "hint": "태백산 검룡소에서 시작되는 한강의 남쪽 물줄기입니다."
  },
  {
    "id": 3,
    "category": "용어",
    "front": "두물머리 (양수리)",
    "back": "경기도 양평군에 위치한 지역으로, 금강산에서 시작된 북한강과 태백산에서 시작된 남한강이 합류하는 장소입니다. '두 물줄기가 만난다'는 뜻의 순우리말 이름을 지니고 있습니다.",
    "hint": "북한강과 남한강이 만나는 경기도 양평의 합류 지점입니다."

  {
    "id": 4,
    "category": "용어",

    "hint": "남한강의 시작점이 되는 태백산에 위치한 발원지입니다."
  },
  {
    "id": 5,
    "category": "용어",
    "front": "암사동 움집터",
    "back": "서울 강동구 암사동에 위치한 선사 시대의 대표적 유적지입니다. 함께 발견된 빗살무늬 토기와 더불어 한강 유역이 아주 오랜 옛날부터 인류의 삶의 터전이었음을 보여줍니다.",
    "hint": "빗살무늬 토기가 출토된 한강 유역의 선사 시대 유적지입니다."
  },
  {
    "id": 6,
    "category": "개념",
    "front": "마한",
    "back": "선사 시대를 거쳐 삼한 시대에 한강 유역을 중심으로 성장한 연맹체입니다. 비옥한 한강 유역의 지리적 이점을 바탕으로 문화와 사회를 발전시켰습니다.",
    "hint": "삼한 시대 한강 유역을 중심으로 성장한 정치 연맹체입니다."
  },
  {
    "id": 7,
    "category": "사건",
    "front": "삼국 시대 한강 쟁탈전",
    "back": "한반도의 주도권을 확보하기 위해 백제, 고구려, 신라가 한강 유역을 차지하고자 벌인 치열한 경쟁입니다. 한강 유역은 교통, 농경, 영토 확장의 핵심 요충지였습니다.",
    "hint": "백제, 고구려, 신라가 한반도 주도권을 위해 벌인 영토 쟁탈전입니다."
  },
  {
    "id": 8,
    "category": "인물",
    "front": "태조 이성계",
    "back": "조선을 건국한 왕으로, 풍수지리가들의 자문을 참고하여 한강이 흐르는 서울(한양)을 새 나라의 도읍지로 확정하였습니다. 한강의 지리적·명당적 가치를 적극 활용하였습니다.",
    "hint": "한강 유역인 한양을 조선의 도읍지로 최종 선정한 국왕입니다."
  },
  {
    "id": 9,
    "category": "사건",
    "front": "한강의 기적",
    "back": "대한민국이 전쟁의 폐허를 극복하고 한강 유역을 중심으로 이룩한 급속한 경제 성장과 현대화를 뜻합니다. 이 결과 한강변에는 유람선과 시민 고수부지 쉼터, 빌딩 숲이 조성되었습니다.",
    "hint": "대한민국의 급속한 경제 성장과 현대화를 이르는 대표적 표현입니다."
  },
  {
    "id": 10,
    "category": "개념",
    "front": "하천 침식 작용",
    "back": "산지를 흐르는 하천 상류에서 세찬 물줄기가 주변 바위나 흙을 깎아내는 지형 형성 작용입니다. 이 과정에서 깎인 바위와 돌은 독특한 경관을 만들고 흙은 하류로 이동합니다.",
    "hint": "하천 상류의 세찬 물줄기가 바위와 흙을 깎아내는 작용입니다."
  },
  {
    "id": 11,
    "category": "개념",
    "front": "하천 퇴적 작용",
    "back": "하천 하류 평지에서 물줄기가 잔잔해지며 상류에서 실려 온 흙이 주변에 쌓이는 지형 작용입니다. 홍수 등이 반복되면서 오랜 시간에 걸쳐 비옥한 평야를 형성합니다.",
    "hint": "하천 하류에서 잔잔한 물줄기로 인해 흙이 쌓이는 작용입니다."
  },
  {
    "id": 12,
    "category": "지형",
    "front": "김포평야",
    "back": "대한민국 중부 지방을 대표하는 한강 하류 주변에 형성된 넓은 평야입니다. 오랜 하천 퇴적 작용을 거쳐 비옥한 농경지가 만들어졌습니다.",
    "hint": "한강 하류의 퇴적 작용으로 형성된 중부 지방의 대표적 평야입니다."
  },
  {
    "id": 13,
    "category": "지형",
    "front": "호남평야",
    "back": "전라도 지방의 만경강과 동진강 주변에 위치한 대규모 평야 지대입니다. 토양이 매우 비옥하고 넓어 예로부터 우리나라의 대표적인 곡식 창고라 불립니다.",
    "hint": "만경강·동진강 주변에 위치한 우리나라의 대표 곡식 창고 평야입니다."
  },
  {
    "id": 14,
    "category": "개념",
    "front": "동고서저 지형",
    "back": "한반도 동쪽에 높게 솟은 태백산맥으로 인해 동쪽은 높고 서쪽은 낮은 지형 특성입니다. 이로 인해 한강, 낙동강 등 한반도의 주요 강들은 대부분 동에서 서쪽 서해로 흐릅니다.",
    "hint": "우리나라 강들이 대부분 동쪽에서 서쪽으로 흐르게 만드는 지형적 특징입니다."
  },
  {
    "id": 15,
    "category": "용어",
    "front": "템즈강과 센강",
    "back": "각각 영국의 수도 런던과 프랑스의 수도 파리를 가로지르는 해외의 대표적 강입니다. 서울의 한강처럼 강이 도시 성장과 발전에 결정적 역할을 했음을 보여주는 대표 사례입니다.",
    "hint": "영국 런던과 프랑스 파리를 흘러 도시 성장을 이끈 주요 강입니다."
  }
];

    let currentIndex = 0;
    const cardInner = document.getElementById("cardInner");
    const catBadge = document.getElementById("catBadge");
    const wordTitle = document.getElementById("wordTitle");
    const backCategory = document.getElementById("backCategory");
    const backDesc = document.getElementById("backDesc");
    const backHint = document.getElementById("backHint");
    const cardCounter = document.getElementById("cardCounter");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");

    function renderCard(idx) {
      cardInner.classList.remove("flipped");
      const item = FLASHCARDS[idx];

      setTimeout(() => {
        catBadge.textContent = item.category;
        wordTitle.textContent = item.front;
        backCategory.textContent = `[${item.category}] ${item.front}`;
        backDesc.textContent = item.back;
        backHint.textContent = item.hint;
        cardCounter.textContent = `카드 ${idx + 1} / ${FLASHCARDS.length}`;

        btnPrev.disabled = (idx === 0);
        btnNext.disabled = (idx === FLASHCARDS.length - 1);
      }, 150);
    }

    function flipCard() {
      cardInner.classList.toggle("flipped");
    }

    function nextCard() {
      if (currentIndex < FLASHCARDS.length - 1) {
        currentIndex++;
        renderCard(currentIndex);
      }
    }

    function prevCard() {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard(currentIndex);
      }
    }

    // 키보드 방향키 및 스페이스바 지원
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        nextCard();
      } else if (e.code === "ArrowLeft") {
        prevCard();
      }
    });

    renderCard(0);

    // 대시보드 postMessage 테마 동기화
    
    try {
      const savedTheme = localStorage.getItem('hanuri_theme') || 'dark';
      document.body.dataset.theme = savedTheme;
    } catch(e) {}

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_THEME') {
        document.body.dataset.theme = e.data.theme;
      }
    });
    try {
      if (window.parent && window.parent.document && window.parent.document.body.dataset.theme) {
        document.body.dataset.theme = window.parent.document.body.dataset.theme;
      }
    } catch(e) {}
  </script>
</body>
</html>
