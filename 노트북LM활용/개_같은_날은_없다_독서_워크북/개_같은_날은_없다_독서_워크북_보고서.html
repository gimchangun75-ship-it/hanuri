## 1. 도서 개요 및 핵심 주제

### (1) 도서 기본 정보
* **도서명**: 『개 같은 날은 없다』 (이옥수 지음, 비룡소 청소년 문학)
* **대상 연령**: 중·고등학생 (청소년 독서 치료 및 독서 토론 교재)
* **분량 및 성격**: 청소년의 내면적 상처, 가정 폭력의 그늘, 방어기제와 관계 치유를 다룬 현대 청소년 소설

### (2) 집필 배경 및 문학적 가치
본 작품은 엄마의 부재 후 해체 위기에 몰린 한 가정의 비극을 통해, 청소년기 아이들이 겪는 정서적 학대와 폭력의 연쇄 반응을 사실적으로 그려낸 수작입니다. 단순히 가정 폭력의 참상을 고발하는 데 그치지 않고, 약자에게 분노가 전이되는 심리적 메커니즘과 사회적 사각지대를 조명함으로써 독자에게 깊은 통찰과 공감을 제공합니다.

### (3) 3대 핵심 주제
1. **폭력의 연쇄와 '링크 이론(The LINK Theory)'**: 스트레스와 억압이 상대적으로 저항력이 없는 약자 및 반려동물에게 쏟아지는 **전이된 공격성(Displaced Aggression)**의 메커니즘을 밝힙니다.
2. **은폐된 '형제·남매 간 폭력 사각지대(Sibling Abuse)'**: '아이들끼리의 흔한 싸움'이라는 미명 하에 가정 내에서 방치되고 묵인되는 일상적 폭력과 침묵의 트라우마를 고발합니다.
3. **'회복적 서클 4대 질문'을 통한 관계 치유**: 처벌과 단죄 중심의 응보적 접근을 넘어, 당사자 간의 공감과 사과, 자발적 책임을 바탕으로 깨어진 관계를 회복하는 대안적 길을 제시합니다.

## 2. 주요 내용과 전개 요약

| 전개 단계 | 핵심 내용 및 주요 사건 | 심리 및 사회적 메커니즘 분석 |
| :--- | :--- | :--- |
| **1단계: 발단** | 엄마의 부재 후 가스 배달 노동을 하는 아빠, 형, 중학생 강민이 살고 있는 험악한 가정환경. 강민이는 버려진 유기견 '찡코'를 데려와 키움. | 슬픔과 결핍을 솔직하게 표현하지 못하고 폭력과 강압으로 집안 분위기가 통제되는 위기상황. |
| **2단계: 전개** | 아빠는 가스 배달의 사회적 좌절과 분노를 형에게 폭력으로 쏟고, 형은 아빠에게 맞은 억울함을 강민에게 풀며, 강민은 찡코를 차고 때림. | **전이된 공격성**: "아빠 ➔ 형 ➔ 강민 ➔ 찡코"로 이어지는 처절한 폭력의 연쇄 고리 형성. |
| **3단계: 절정** | 아빠와 형이 격렬하게 다툰 날, 통제할 수 없는 분노에 휩싸인 강민이가 아끼던 찡코를 때려죽이는 비극이 발생함. | 방어기제의 폭발 및 범죄심리학의 **'링크 이론'**(동물 학대가 강력범죄 전조로 나타남) 투영. 강민의 극심한 죄책감. |
| **4단계: 위기** | 이웃집 여학생 미나의 거식증(섭식장애)과 비밀 폭로. 미나는 어릴 적 오빠의 지속적 폭력과 어머니의 묵인 속에서 트라우마를 겪음. | **형제간 폭력 사각지대** 및 어머니의 편애·묵인이 만든 침묵의 카르텔. 미나의 거식증은 자기파괴적 무의식 저항. |
| **5단계: 결말/회복** | 미나와 강민이가 애니멀 커뮤니케이터를 찾고, 찡코의 영혼과의 교감을 통해 상처를 고백함. 회복적 대화를 통해 치유로 나아감. | **내면아이(Inner Child)**의 상처 객관화. 사람은 관계 속에서 상처받지만 솔직한 고백과 용서의 관계 속에서 치유됨. |

## 3. 핵심 쟁점과 생각해 볼 문제

### 쟁점 1. [심리학] '링크 이론(The LINK Theory)'과 전이된 공격성 (Displaced Aggression)
* **내용 분석**: 인간은 강자(사회, 아빠, 형)로부터 부당한 스트레스를 받을 때 원인 제공자에게 저항하지 못하면 자신보다 약하고 저항 불가능한 대상(동생, 약자, 반려동물)에게 분노를 쏟아붓습니다. 강민이가 찡코를 죽이게 된 비극은 바로 이 전이된 공격성의 최극단 형태입니다.
* **학술적 시사점**: 범죄심리학의 **'링크 이론'**에 따르면 가정폭력, 아동학대, 동물학대는 별개의 사건이 아닌 하나의 고리로 연결되어 있습니다. 동물에 대한 잔혹한 폭력은 향후 인간 대상 강력범죄로 이어질 수 있는 가장 위험한 전조 증상(Predictor of Violence)입니다.

### 쟁점 2. [사회학] 가정 내 은폐된 '형제·남매 간 폭력 사각지대 (Sibling Abuse)'
* **내용 분석**: 가정폭력이라 하면 부모-자식 간 학대나 부부 폭력을 떠올리기 쉽지만, 청소년 상담 현장에서 가장 은폐되고 깊은 상처를 남기는 것은 "아이들끼리 싸우면서 크는 것"으로 치부되는 형제간 폭력입니다.
* **사례 분석 (미나의 거식증)**: 미나는 오빠의 신체적·정서적 괴롭힘에도 "오빠니까 참아라"라며 오빠를 감싸고 돈 어머니의 태도로 인해 심각한 거식증을 겪습니다. 이는 가정 내 불공정과 폭력에 대해 자신의 몸을 파괴하며 저항하려 했던 무의식적 절규입니다.

### 쟁점 3. [교육/사법] 응보적 사법(Punitive Justice)의 한계와 회복적 정의(Restorative Justice)
* **기존 방식의 한계**: 기존 학교나 사법 체계의 **응보적 사법**은 "누가 법/규칙을 위반했는가? 어떤 처벌을 내릴 것인가?"에만 집중합니다. 그러나 이는 피해자의 마음을 아물게 하지 못하며, 가해자에게 낙인을 찍어 더 거친 폭력으로 내몰 위험이 있습니다.
* **대안으로서의 회복적 서클 4대 질문**:
  1. **무슨 일이 일어났는가?** (사건의 객관적 진실 직면)
  2. **그 일로 인해 누가 어떤 고통과 상처를 받았는가?** (피해 공감 및 가해자의 책임 자각)
  3. **깨어진 관계와 피해를 바로잡기 위해 지금 무엇이 필요한가?** (자발적 배상과 노력)
  4. **앞으로 평화롭게 공존하기 위해 우리는 서로 어떤 약속을 할 수 있는가?** (재발 방지 및 공동체 회복)

## 4. 심층 독서토론 질문 3선과 지도 가이드

### [질문 1] 전이된 공격성과 폭력의 고리 끊기 (심리·행동 탐구)
> **Q. 강민이는 찡코를 누구보다 아끼고 사랑했음에도 불구하고 왜 발로 차고 결국 죽음에 이르게 했을까요? 강민이가 겪은 '전이된 공격성'의 원인을 분석해 보고, 만약 여러분이 강민이의 입장이라면 아빠와 형의 폭력 속에서 찡코를 지키고 폭력의 고리를 끊기 위해 어떤 선택을 했을지 이야기해 봅시다.**
* **지도 가이드**: 독자가 강민이를 단순한 '잔혹한 가해자'로 단죄하기보다, 아빠 ➔ 형 ➔ 강민 ➔ 찡코로 이어지는 폭력의 연쇄 속 피해자이자 가해자라는 입체적 구조를 이해하도록 이끕니다. 약자에게 분노를 발산하는 방어기제 대신, 믿을 수 있는 외부 어른(교사, 상담사, 전문 기관)에게 도움을 요청하는 건강한 대처 방안을 탐색하도록 지도합니다.

### [질문 2] 형제간 폭력 사각지대와 침묵의 카르텔 (사회·가정 탐구)
> **Q. 미나의 거식증은 오빠의 지속적인 폭력과 이를 "참으라"며 묵인한 어머니의 태도에서 비롯되었습니다. 우리 사회에서 형제·남매 간의 폭력이 '흔한 아이들 싸움'으로 방치될 때 발생하는 문제점은 무엇이며, 가정 내 침묵의 카르텔을 깨기 위해 부모와 사회는 어떤 역할을 해야 할까요?**
* **지도 가이드**: 신체적 완력 차이로 인한 서열 고착화가 가정이라는 공간을 만성적 공포의 장소로 바꾼다는 점을 지적하게 합니다. 부모의 공정하고 중립적인 개입의 중요성을 강조하고, 피해자의 상처를 감싸안는 가정 내 소통 문화의 필요성에 대해 토론하도록 유도합니다.

### [질문 3] 회복적 서클 4대 질문을 통한 관계 회복 (대안·치유 탐구)
> **Q. 강민이네 가족의 비극을 해결하기 위해 아빠나 형을 처벌하는 '응보적 방식' 대신, 둘러앉아 대화를 나누는 '회복적 서클 4대 질문'을 적용해 보고자 합니다. 각 인물(아빠, 형, 강민)은 회복적 서클 모임에서 서로에게 어떤 진솔한 고백과 사과, 그리고 재발 방지 약속을 건네야 할까요?**
* **지도 가이드**: 학생들이 가해자와 피해자 역할을 교대로 맡아 회복적 4대 질문(진실, 공감/고통, 피해복구/책임, 평화공존/약속)을 바탕으로 역할극을 진행하도록 합니다. "사람은 관계 속에서 상처받지만, 진솔한 용서와 고백의 관계 속에서만 치유된다"는 메시지를 체득하게 돕습니다.

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const rawText = document.getElementById('rawMarkdown').textContent.trim();
      if (!rawText || rawText === '{{RAW_MARKDOWN}}') {
        // 템플릿 기본 프리뷰 상태일 때 안내 표시
        return;
      }
      renderReport(rawText);
    });

    function renderReport(md) {
      const lines = md.split('\n');
      let title = "";
      let subtitle = "";
      const sections = [];
      let currentSec = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('# ') && !title) {
          title = line.replace('# ', '').trim();
          continue;
        }
        if (line.startsWith('**—') || line.startsWith('**-')) {
          subtitle = line.replace(/\*\*/g, '').replace(/^[—\-]\s*/, '').replace(/\s*[—\-]$/, '').trim();
          continue;
        }
        if (line.startsWith('## ')) {
          if (currentSec) sections.push(currentSec);
          currentSec = {
            title: line.replace('## ', '').trim(),
            content: []
          };
          continue;
        }
        if (currentSec) {
          currentSec.content.push(line);
        }
      }
      if (currentSec) sections.push(currentSec);

      if (title) {
        document.getElementById('headerTitle').innerText = title;
        document.title = title + " - 종합 독서 분석 보고서";
      }
      if (subtitle) {
        document.getElementById('headerSubtitle').innerText = subtitle;
      }

      const container = document.getElementById('reportContent');
      container.innerHTML = '';

      sections.forEach((sec, idx) => {
        const secBlock = document.createElement('section');
        secBlock.className = 'section-block';

        const titleMatch = sec.title.match(/^(\d+)\.\s*(.*)$/);
        const secNum = titleMatch ? titleMatch[1] : (idx + 1);
        const secTitleText = titleMatch ? titleMatch[2] : sec.title;

        secBlock.innerHTML = `
          <div class="section-title-wrap">
            <div class="section-num">${secNum}</div>
            <h2 class="section-title">${secTitleText}</h2>
          </div>
          <div class="section-body">${renderSectionBody(secNum, sec.content.join('\n'))}</div>
        `;
        container.appendChild(secBlock);
      });
    }

    function renderSectionBody(num, text) {
      if (String(num) === '4') {
        return renderDiscussionSection(text);
      }
      if (String(num) === '5') {
        return renderLessonAndParentSection(text);
      }
      return renderGeneralSection(text);
    }

    function renderDiscussionSection(text) {
      const blocks = text.split(/###\s+/).filter(b => b.trim());
      let html = '';
      blocks.forEach(block => {
        const lines = block.split('\n');
        const head = lines[0].trim();
        const bodyLines = lines.slice(1);
        
        let badgeClass = 'badge-interpret';
        let badgeText = '해석적 질문';
        if (head.includes('평가')) { badgeClass = 'badge-evaluate'; badgeText = '평가적 질문'; }
        if (head.includes('실천')) { badgeClass = 'badge-action'; badgeText = '실천적 질문'; }

        let questionText = '';
        let guideHtml = '';

        bodyLines.forEach(l => {
          const trimmed = l.trim();
          if (trimmed.startsWith('>')) {
            questionText += trimmed.replace(/^>\s*/, '').replace(/\*\*/g, '') + ' ';
          } else if (trimmed.startsWith('- **탐구 방향**') || trimmed.startsWith('- **토의 포인트**')) {
            const parts = trimmed.split(/:\s*/);
            const label = parts[0].replace(/[-*]/g, '').trim();
            const val = parts.slice(1).join(': ').trim();
            guideHtml += `
              <div class="guide-row">
                <span class="guide-label">${label} :</span>
                <span>${val}</span>
              </div>
            `;
          }
        });

        html += `
          <div class="discussion-card">
            <div class="discussion-header">
              <span style="font-weight:700; color:var(--navy);">${head}</span>
              <span class="discussion-badge ${badgeClass}">${badgeText}</span>
            </div>
            <div class="discussion-q">${questionText}</div>
            <div class="discussion-guide">${guideHtml}</div>
          </div>
        `;
      });
      return html;
    }

    function renderLessonAndParentSection(text) {
      const parts = text.split(/###\s+나\.\s*학부모/);
      const lessonPart = parts[0] || '';
      const parentPart = parts[1] || '';

      let html = renderGeneralSection(lessonPart);

      if (parentPart) {
        let msg = parentPart.replace(/^.*\[학부모 상담용 메시지 예시\]/s, '').replace(/>/g, '').trim();
        html += `
          <div class="parent-message-card">
            <div class="parent-message-head">
              <div class="parent-message-title">💌 학부모 상담 및 알림장 전달 메시지</div>
              <button class="copy-btn" onclick="copyParentMessage()">📋 메시지 전체 복사</button>
            </div>
            <div class="parent-message-body" id="parentMessageText">${msg}</div>
          </div>
        `;
      }
      return html;
    }

    function renderGeneralSection(text) {
      let html = '';
      const subBlocks = text.split(/###\s+/).filter(b => b.trim());

      subBlocks.forEach(sub => {
        const lines = sub.split('\n');
        const subTitle = lines[0].trim();
        const contentLines = lines.slice(1);

        html += `<div class="sub-section">`;
        if (subTitle) {
          html += `<h3 class="sub-section-title">${subTitle}</h3>`;
        }

        let inList = false;
        let listHtml = '';

        contentLines.forEach(line => {
          const l = line.trim();
          if (!l || l === '---') return;

          if (l.startsWith('- **핵심 탐구 질문**:')) {
            const q = l.replace('- **핵심 탐구 질문**:', '').replace(/\*\*/g, '').trim();
            html += `
              <div class="highlight-box">
                <div class="box-label">핵심 탐구 질문 (Core Question)</div>
                <div class="box-text">${q}</div>
              </div>
            `;
          } else if (l.startsWith('- **') || l.startsWith('- ')) {
            const content = l.replace(/^-\s*/, '').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html += `<div class="tag-item">${content}</div>`;
          } else if (/^\d+\.\s+\*\*/.test(l)) {
            const match = l.match(/^\d+\.\s+\*\*(.*?)\*\*:\s*(.*)$/);
            if (match) {
              html += `
                <div class="knowledge-item" style="margin-bottom:12px;">
                  <div class="knowledge-head">${match[1]}</div>
                  <div class="knowledge-body">${match[2]}</div>
                </div>
              `;
            } else {
              html += `<p class="desc-text">${l.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>`;
            }
          } else {
            html += `<p class="desc-text">${l.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</p>`;
          }
        });

        html += `</div>`;
      });
      return html;
    }

    function copyParentMessage() {
      const el = document.getElementById('parentMessageText');
      if (!el) return;
      const text = el.innerText;
      navigator.clipboard.writeText(text).then(() => {
        showToast();
      }).catch(() => {
        const t = document.createElement('textarea');
        t.value = text;
        document.body.appendChild(t);
        t.select();
        document.execCommand('copy');
        document.body.removeChild(t);
        showToast();
      });
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // 대시보드 postMessage 테마 동기화
    
    try {
      const savedTheme = localStorage.getItem('hanuri_theme') || 'dark';
      document.body.dataset.theme = savedTheme;
    } catch(e) {}

    window.addEventListener('message', (e) => {
      if (e.data && e.data.type === 'SET_THEME') {
        document.body.dataset.theme = e.data.theme;
      }
    });
  </script>
</body>
</html>
